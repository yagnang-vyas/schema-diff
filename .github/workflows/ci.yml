name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schemadiff
          POSTGRES_PASSWORD: ci_local_only_pw
          POSTGRES_DB: schemadiff
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schemadiff -d schemadiff"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_local_only_pw
          MYSQL_DATABASE: schemadiff
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_local_only_pw --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SCHEMADIFF_REQUIRE_DB: "1"
      SCHEMADIFF_PG_URL: postgresql+psycopg://schemadiff:ci_local_only_pw@127.0.0.1:5432/schemadiff
      SCHEMADIFF_MYSQL_URL: mysql+pymysql://root:ci_local_only_pw@127.0.0.1:3306/schemadiff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make install
      - run: make check

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemadiff"
version = "0.1.0"
description = "Read-only CLI that reports schema drift between PostgreSQL or MySQL databases and saved snapshots."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yagnang Vyas" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
schemadiff = "schemadiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs real PostgreSQL / MySQL databases"]

[tool.coverage.run]
branch = true
source = ["schemadiff"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

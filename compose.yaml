# Local databases for development and the integration tests.
# Credentials are fake and local-only; they come from .env (copy .env.example).
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: schemadiff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: schemadiff
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemadiff -d schemadiff"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: schemadiff
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
